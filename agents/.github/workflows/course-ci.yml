name: course-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install 'google-adk[db]'

      - name: Import + MCP structure verify
        run: python scripts/verify_course_imports.py
        env:
          # MCP server download may need network; Node optional in CI
          CI: "true"

      - name: Offline unit tests
        run: pytest modules/07-evaluation/tests modules/09-capstone/tests -q

      - name: Graph lab smoke (no LLM)
        run: python modules/18-graphs/run_loan_graph.py --text "loan of 5000"

      - name: HITL stub smoke
        run: python modules/23-long-running-hitl/refund_hitl_stub.py

      - name: Skills load smoke
        run: python modules/24-skills/run_skills_demo.py

      - name: Live queue offline smoke
        run: python modules/26-live-streaming/run_live_offline_queue.py

      - name: OAuth simulation smoke
        run: python modules/27-oauth-flow/run_oauth_simulation.py

      - name: A2A import / to_a2a smoke
        run: python modules/28-a2a-demo/smoke_imports.py
        env:
          ADK_SUPPRESS_A2A_EXPERIMENTAL_FEATURE_WARNINGS: "1"

