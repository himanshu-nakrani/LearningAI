<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Agentic AI with Google ADK — course reader" />
  <title>ADK Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <button type="button" class="brand-btn" data-route="home" title="Home">
          <span class="brand-word">ADK Course</span>
          <span class="brand-sub">Google ADK 2.x</span>
        </button>
        <button type="button" class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close sidebar">×</button>
      </div>

      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Filter modules…" autocomplete="off" />
      </div>

      <div class="progress-strip">
        <div class="progress-meta">
          <span>Progress</span>
          <span id="progress-label">0 / 29</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Course modules"></nav>

      <div class="sidebar-footer">
        <button type="button" class="text-btn" data-route="resources">Resources</button>
        <button type="button" class="text-btn" id="reset-progress" title="Clear local progress">Reset</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <div class="topbar-trail" id="breadcrumb"></div>
        <button type="button" class="search-trigger" id="open-search" title="Search">Search <kbd>/</kbd></button>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel" role="dialog" aria-label="Search course">
      <input type="search" id="search-modal-input" placeholder="Search the course…" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
      <p class="search-hint">Esc to close · Enter to open</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
