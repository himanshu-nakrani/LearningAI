<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Agentic AI with Google ADK — interactive course reader" />
  <title>ADK Course · Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <button type="button" class="brand-btn" data-route="home" title="Home">
          <span class="brand-mark">ADK</span>
          <span class="brand-text">
            <strong>Agent Course</strong>
            <small>Google ADK 2.x</small>
          </span>
        </button>
        <button type="button" class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close sidebar">×</button>
      </div>

      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Filter modules…" autocomplete="off" />
      </div>

      <div class="progress-strip">
        <div class="progress-meta">
          <span>Progress</span>
          <span id="progress-label">0 / 29</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Course modules"></nav>

      <div class="sidebar-footer">
        <button type="button" class="text-btn" data-route="resources">Resources</button>
        <button type="button" class="text-btn" id="reset-progress" title="Clear local progress">Reset</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <div class="topbar-trail" id="breadcrumb"></div>
        <div class="topbar-actions" title="Press / to search">
          <kbd class="hint-key">/</kbd>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel" role="dialog" aria-label="Search course">
      <input type="search" id="search-modal-input" placeholder="Search titles, summaries, content…" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
      <p class="search-hint">Esc close · ↑↓ navigate · Enter open</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
